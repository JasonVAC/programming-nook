plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.176'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

base {
    archivesName = 'RubyMod'
}

group = 'com.ruby'
version = '1.0.0'

// Runs section removed - will fix after initial build succeeds

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "rubyblock",
                "Specification-Vendor"    : "Clawy",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "Clawy",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
